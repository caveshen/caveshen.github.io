name: CI and deploy

on:
  # Ready pull requests run the full six-project matrix. A push to main
  # (a squash-merge of a PR the matrix already proved) runs the unit suite
  # and deploys. A push to the working branch runs the unit suite and
  # deploys the preview host. Nothing else runs CI. Docs-only changes never
  # run anything: the build reads no markdown, and docs/ holds only prose.
  push:
    branches: [main, item/videogame-menus]
    tags-ignore: ['**']
    paths-ignore: ['**.md', 'docs/**']

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**']

  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; main queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # One shard per Playwright project: wall time is the slowest project
    # plus install overhead. 25 minutes leaves room for a slow WebKit shard.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-15pro, ipad, pixel-8, desktop-1920, desktop-2560, desktop-firefox]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Chromium-family projects use branded Edge via channel: msedge, which
      # is preinstalled on ubuntu runners. Only WebKit and Firefox need
      # Playwright's bundled builds.
      - name: Install Playwright browsers
        run: |
          case "${{ matrix.project }}" in
            iphone-15pro|ipad) npx playwright install --with-deps webkit ;;
            desktop-firefox)   npx playwright install --with-deps firefox ;;
          esac

      - name: Integration tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

  deploy-cloudflare:
    # The only job that ships to caveshen.com. The merged SHA was proved by
    # the PR matrix; the unit suite is the last cheap gate before deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=caveshen-com --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-preview:
    # The working branch ships to preview.caveshen.com on every push, gated
    # on the unit suite only. Its own Pages project; removed at the cutover.
    if: github.event_name == 'push' && github.ref == 'refs/heads/item/videogame-menus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (preview host)
        run: npm run build
        env:
          SITE: https://preview.caveshen.com

      - name: Deploy to Cloudflare Pages (preview project)
        run: npx wrangler@4 pages deploy dist --project-name=caveshen-preview --branch=item/videogame-menus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
