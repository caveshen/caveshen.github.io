name: Deploy to GitHub Pages

on:
  # Branch pushes run a light check; PRs run the full tri-engine matrix.
  # Build and deploy are gated to main below. The build reads no markdown,
  # so md-only pushes skip CI. Not docs/** — it holds code the tests import.
  push:
    branches: ['**']
    tags-ignore: ['**']
    paths-ignore: ['**.md']

  pull_request:
    branches: [main]
    # Same rule as push: the build reads no markdown, so md-only PRs skip.
    paths-ignore: ['**.md']

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Superseded branch runs are cancelled; main queues. The Pages concurrency
# group lives on the deploy job so a slow test run can never hold it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # A push to any branch but main is the light check. PRs and main run everything.
  LIGHT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung WebKit run holds the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for PLACEHOLDER tokens (warns, never fails)
        run: node docs/placeholder-check.js

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ env.LIGHT == 'true' && 'chromium' || 'chromium webkit firefox' }}

      - name: Integration tests
        run: npm run test:e2e -- ${{ env.LIGHT == 'true' && '--project=desktop-1920' || '' }}

      - name: Performance suite (report-only)
        # The suite never asserts budgets — it captures metrics and warns on regression.
        # continue-on-error: a broken harness must never block a main deploy.
        continue-on-error: true
        run: npm run test:perf

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
