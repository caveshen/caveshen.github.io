<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Badger head, full frontal, symmetric about x=100. Flat fills via classes only. -->

  <!-- shoulders — a darker cream mound, separates body from the pale face -->
  <path class="f-crater" d="M20,220 L35,192 Q60,148 100,156 Q140,148 165,192 L180,220 Z" />

  <!-- head — one silhouette: dome crown, wide cheeks, short rounded muzzle.
       Cubic curves through the jaw taper so the corners round off instead
       of faceting where each anchor point meets the next. -->
  <path class="f-moon" d="M100,28
                          Q124,30 148,60
                          Q157,72 156,95
                          C153,105 136.33,112.5 130,120
                          C123.67,127.5 121,135.33 118,140
                          C115,144.67 115,146 112,148
                          C109,150 104,152 100,152
                          C96,152 91,150 88,148
                          C85,146 85,144.67 82,140
                          C79,135.33 76.33,127.5 70,120
                          C63.67,112.5 47,105 44,95
                          Q43,72 52,60
                          Q76,30 100,28 Z" />

  <!-- ears — pale nubs at the top corners -->
  <circle class="f-moon" cx="60" cy="36" r="16" />
  <circle class="f-moon" cx="140" cy="36" r="16" />

  <!-- mask bands — filled wedges, narrow beside the muzzle, widest at the
       eye line, then running on up into the ear base (meeting the dark
       inner ear) without a pale gap at the crown; pale gap between the
       two bands reads as the blaze. Kept close to a straight run through
       the neck of the head so the band never outgrows the pale silhouette
       at its narrowest point, just below the ear. -->
  <path class="f-head-dark" d="M135,44 Q138,68 141,90 Q139,107 117,122
                                L108,122 Q110,107 111,90 Q118,68 127,44 Z" />
  <path class="f-head-dark" d="M65,44 Q62,68 59,90 Q61,107 83,122
                                L92,122 Q90,107 89,90 Q82,68 73,44 Z" />

  <!-- inner ears — dark, inset inside the pale ear nubs, shifted toward the
       blaze so they meet the band's upper tip -->
  <circle class="f-head-dark" cx="63" cy="37" r="8" />
  <circle class="f-head-dark" cx="137" cy="37" r="8" />

  <!-- nose pad -->
  <ellipse class="f-head-dark" cx="100" cy="141" rx="9" ry="6" />

  <!-- eyes — pale glints carried on the bands -->
  <ellipse class="f-moon" cx="74" cy="90" rx="3.5" ry="3" />
  <ellipse class="f-moon" cx="126" cy="90" rx="3.5" ry="3" />
</svg>
